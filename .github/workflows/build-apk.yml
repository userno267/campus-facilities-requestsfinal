name: Build Campus Reports APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install project dependencies exactly as in package-lock.json
      - name: Install npm dependencies
        run: npm ci

      # 4. Build the Ionic/Angular app (production settings = the hosted backend)
      - name: Build Ionic application
        run: npm run build

      # 5. Safety check: the build must contain the hosted API address, not localhost
      - name: Check the API address in the build
        run: |
          grep -rl "campus-facilities-requestsfinal.onrender.com" www | head -n 3
          grep -rq "campus-facilities-requestsfinal.onrender.com" www

      # 6. Install Java 21 (Capacitor 8 Android compiles with Java 21)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 7. Copy the web build into the Android project
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 8. Allow Gradle to run
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      # 9. Build the debug APK
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 10. Give the APK a clear name
      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk campus-reports.apk

      # 11. Keep the APK on GitHub for 30 days
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusReports-APK
          path: campus-reports.apk
          if-no-files-found: error
          retention-days: 30